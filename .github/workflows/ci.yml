name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release AAR
        run: ./gradlew :meldsdk:assembleRelease

      - name: Build example app
        run: ./gradlew :example:assembleDebug

      - name: Unit tests
        run: ./gradlew :meldsdk:testReleaseUnitTest

      - name: Publish to Maven local (smoke-test publishing)
        run: ./gradlew :meldsdk:publishReleasePublicationToMavenLocal
