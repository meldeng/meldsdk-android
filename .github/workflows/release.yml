name: Release

# Publishes io.meld:meldsdk to Maven Central when a version tag is pushed.
# The published version is the tag name (a leading "v" is stripped), e.g.:
#   git tag 0.3.0 && git push origin 0.3.0
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   MAVEN_CENTRAL_USERNAME   Central Portal user-token username
#   MAVEN_CENTRAL_PASSWORD   Central Portal user-token password
#   GPG_KEY                  ASCII-armored GPG private key (gpg --armor --export-secret-keys <KEYID>)
#   GPG_PASSPHRASE           passphrase for that key
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish + release to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: >
          ./gradlew :meldsdk:publishAndReleaseToMavenCentral
          -PmeldsdkVersion=${{ steps.version.outputs.value }}
          --no-configuration-cache --stacktrace
